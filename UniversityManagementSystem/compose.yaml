services:
  database:
    image: postgres:16-alpine
    container_name: university-db
    environment:
      POSTGRES_DB: university_db
      POSTGRES_USER: university
      POSTGRES_PASSWORD: university123
    volumes:
      - university_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U university -d university_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: university-app
    ports:
      - "8081:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/university_db
      SPRING_DATASOURCE_USERNAME: university
      SPRING_DATASOURCE_PASSWORD: university123
    depends_on:
      database:
        condition: service_healthy

volumes:
  university_data:
