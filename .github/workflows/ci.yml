name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: UniversityManagementSystem

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compile
        run: mvn -B -ntp clean compile

      - name: Run unit tests
        run: mvn -B -ntp test -Dtest='UserServiceTest'

      - name: Run integration tests
        if: ${{ !cancelled() }}
        run: mvn -B -ntp test -Dtest='*IntegrationTest'

      - name: Test summary
        if: always()
        run: |
          {
            echo "| Test class | Tests | Failures | Errors | Skipped |"
            echo "|---|---|---|---|---|"
            for report in target/surefire-reports/TEST-*.xml; do
              [ -e "$report" ] || continue
              name=$(basename "$report" .xml); name=${name#TEST-}
              line=$(grep -o '<testsuite[^>]*>' "$report" | head -1)
              get() { echo "$line" | grep -o "$1=\"[^\"]*\"" | cut -d'"' -f2; }
              echo "| \`${name##*.}\` | $(get tests) | $(get failures) | $(get errors) | $(get skipped) |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: UniversityManagementSystem/target/surefire-reports/
          if-no-files-found: warn
